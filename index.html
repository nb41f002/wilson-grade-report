<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>葳格雙語成績報告 · Wilson Grade Report</title>
  <link rel="icon" type="image/svg+xml" href="assets/wilson-crest.svg">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <header class="top-navbar no-print">
    <div class="brand-section">
      <img src="assets/wilson-crest.svg" alt="" class="brand-logo" width="36" height="42">
      <div>
        <h1 class="brand-title" data-i18n="brandTitle">雙語小學橫式成績報告</h1>
        <p class="brand-subtitle" data-i18n="brandSubtitle">Wilson International · 葉容辰老師</p>
      </div>
    </div>
    <div class="locale-toggle" role="group" aria-label="Language">
      <button type="button" class="locale-btn active" data-locale="zh">繁中</button>
      <button type="button" class="locale-btn" data-locale="en">English</button>
    </div>
    <div class="save-status-badge" title="資料存在本機瀏覽器">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="save-status-text" data-i18n="saveReady">就緒</span>
    </div>
    <div class="top-actions">
      <input type="file" id="file-import-input" accept=".json,application/json" hidden>
      <button type="button" class="btn btn-secondary" onclick="document.getElementById('file-import-input').click()" data-i18n="btnImport">讀取備份</button>
      <button type="button" class="btn btn-secondary" id="btn-export-json" data-i18n="btnExport">匯出 JSON</button>
      <button type="button" class="btn btn-secondary" id="btn-reset-sample" data-i18n="btnSample">示範資料</button>
      <button type="button" class="btn btn-print" id="btn-print-current" data-i18n="btnPrintCurrent">列印此生</button>
      <button type="button" class="btn btn-accent" id="btn-print-all" data-i18n="btnPrintAll">全班連印</button>
    </div>
  </header>

  <main class="main-layout">
    <aside class="editor-sidebar no-print">
      <div class="sidebar-header">
        <div class="student-bar">
          <div class="student-selector-wrap">
            <button type="button" class="btn btn-secondary btn-icon" id="btn-prev-student" data-i18n-aria="prevStudent" aria-label="上一位">◀</button>
            <select id="student-select" class="student-select" data-i18n-aria="selectStudent" aria-label="選擇學生"></select>
            <button type="button" class="btn btn-secondary btn-icon" id="btn-next-student" data-i18n-aria="nextStudent" aria-label="下一位">▶</button>
          </div>
          <span class="student-counter" id="student-counter">1 / 1</span>
        </div>
        <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="student-actions">
          <button type="button" class="btn btn-primary btn-sm" id="btn-add-student" data-i18n="btnAdd">＋ 新增</button>
          <button type="button" class="btn btn-secondary btn-sm" id="btn-batch-import" data-i18n="btnBatch">貼上名單</button>
          <button type="button" class="btn btn-danger btn-sm" id="btn-delete-student" data-i18n="btnDelete">刪除</button>
        </div>
      </div>

      <div class="sidebar-scroll">
        <section class="card-section">
          <h2 class="section-title" data-i18n="sectionSchool">學校與學期</h2>
          <div class="form-grid-2">
            <div class="form-group span-2">
              <label class="form-label" for="input-year" data-i18n="labelYear">學年度標題（英文）</label>
              <input type="text" id="input-year" class="form-input" placeholder="The Second Semester of the 114th Academic Year">
            </div>
            <div class="form-group">
              <label class="form-label" for="input-term" data-i18n="labelTerm">報告類型（可改）</label>
              <input type="text" id="input-term" class="form-input" placeholder="Midterm">
            </div>
            <div class="form-group weights-group">
              <label class="form-label" data-i18n="labelWeights">比重 %</label>
              <div class="weight-inputs">
                <label><span data-i18n="weightMid">期中</span> <input type="number" id="input-weight-mid" class="form-input weight-input" min="0" max="100"></label>
                <label><span data-i18n="weightDaily">平時</span> <input type="number" id="input-weight-daily" class="form-input weight-input" min="0" max="100"></label>
              </div>
            </div>
            <div class="form-group span-2">
              <label class="chk-line"><input type="checkbox" id="chk-homeroom" checked> <span data-i18n="chkHomeroom">簽名區顯示「導師」欄</span></label>
            </div>
          </div>
        </section>

        <section class="card-section">
          <h2 class="section-title" data-i18n="sectionStudent">學生資料</h2>
          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="input-chinese-name" data-i18n="labelChineseName">中文姓名</label>
              <input type="text" id="input-chinese-name" class="form-input" placeholder="林詩穎" autocomplete="off">
            </div>
            <div class="form-group">
              <label class="form-label" for="input-english-name" data-i18n="labelEnglishName">English Name</label>
              <input type="text" id="input-english-name" class="form-input" placeholder="Alice" autocomplete="off">
            </div>
            <div class="form-group">
              <label class="form-label" for="input-class-grade" data-i18n="labelClass">班級</label>
              <input type="text" id="input-class-grade" class="form-input" placeholder="Grade 4 / 401">
            </div>
            <div class="form-group">
              <label class="form-label" for="input-student-id" data-i18n="labelStudentId">學號</label>
              <input type="text" id="input-student-id" class="form-input" placeholder="W114028">
            </div>
          </div>
          <div class="flag-row">
            <label class="chk-line"><input type="checkbox" id="flag-intl"> <span data-i18n="flagIntl">國際生</span></label>
            <label class="chk-line"><input type="checkbox" id="flag-conduct"> <span data-i18n="flagConduct">操行 Independent</span></label>
            <label class="chk-line"><input type="checkbox" id="flag-ixl"> <span data-i18n="flagIxl">IXL 附註</span></label>
            <label class="chk-line"><input type="checkbox" id="flag-map"> <span data-i18n="flagMap">MAP 列印註記</span></label>
          </div>
        </section>

        <section class="card-section">
          <h2 class="section-title" data-i18n="sectionSubjects">科目設定（勾選／新增／排序）</h2>
          <p class="section-hint" data-i18n="subjectsHint">可勾選顯示、上下調整順序；自訂科目可重新命名或刪除。</p>
          <div id="subjects-config" class="subjects-config"></div>
          <div class="add-subject-panel" id="add-subject-panel">
            <h3 class="add-subject-title" data-i18n="btnAddSubject">新增科目</h3>
            <div class="add-subject-grid">
              <div class="form-group">
                <label class="form-label" for="input-new-subj-name" data-i18n="labelSubjectName">科目名稱（必填）</label>
                <input type="text" id="input-new-subj-name" class="form-input" data-i18n-placeholder="placeholderSubjectName" placeholder="例如 Drama" autocomplete="off">
              </div>
              <div class="form-group">
                <label class="form-label" for="input-new-subj-zh" data-i18n="labelSubjectZh">中文名稱（選填）</label>
                <input type="text" id="input-new-subj-zh" class="form-input" data-i18n-placeholder="placeholderSubjectZh" placeholder="例如 戲劇" autocomplete="off">
              </div>
              <div class="form-group">
                <label class="form-label" for="select-new-subj-cat" data-i18n="labelSubjectCategory">分類</label>
                <select id="select-new-subj-cat" class="form-input">
                  <option value="core" data-i18n="catCore">核心</option>
                  <option value="special" data-i18n="catSpecial">專科</option>
                  <option value="chinese" data-i18n="catChinese">中文</option>
                  <option value="other" selected data-i18n="catOther">其他</option>
                </select>
              </div>
              <div class="form-group add-subject-actions">
                <button type="button" class="btn btn-primary btn-sm" id="btn-add-subject" data-i18n="btnSaveSubject">加入</button>
              </div>
            </div>
          </div>
        </section>

        <section class="card-section subjects-section">
          <h2 class="section-title" data-i18n="sectionGrades">各科成績與評語</h2>
          <p class="section-hint" data-i18n="sectionHint">期中 + 平時依比重自動算總評；可勾「手動」覆寫。學習習慣選 EE / ME / AE / BE。</p>
          <div id="subject-list"></div>
        </section>
      </div>
    </aside>

    <section class="preview-stage">
      <div class="stage-toolbar no-print">
        <span class="zoom-label" data-i18n="zoomLabel">A4 橫式預覽（297×210 mm）</span>
        <div class="zoom-controls">
          <button type="button" class="zoom-btn" id="btn-zoom-out" aria-label="縮小">−</button>
          <span id="zoom-val">72%</span>
          <button type="button" class="zoom-btn" id="btn-zoom-in" aria-label="放大">+</button>
          <button type="button" class="btn btn-secondary btn-sm" id="btn-zoom-reset" data-i18n="zoomReset">重設</button>
        </div>
      </div>
      <div class="preview-scroll">
        <div id="report-viewport" class="report-viewport" style="--preview-scale: 0.72"></div>
      </div>
    </section>
  </main>

  <div class="modal-overlay no-print" id="comment-modal" role="dialog" aria-modal="true" aria-labelledby="comment-modal-title">
    <div class="modal-window">
      <div class="modal-header">
        <h3 class="modal-title" id="comment-modal-title" data-i18n="commentModalTitle">常用評語庫</h3>
        <button type="button" class="modal-close-btn" id="comment-modal-close" data-i18n-aria="close" aria-label="關閉">×</button>
      </div>
      <div class="modal-body" id="comment-bank-container"></div>
    </div>
  </div>

  <div class="modal-overlay no-print" id="batch-modal" role="dialog" aria-modal="true">
    <div class="modal-window">
      <div class="modal-header">
        <h3 class="modal-title" data-i18n="batchModalTitle">貼上學生名單</h3>
        <button type="button" class="modal-close-btn" id="batch-modal-close" data-i18n-aria="close" aria-label="關閉">×</button>
      </div>
      <div class="modal-body">
        <p class="modal-help" data-i18n="batchHelp">一行一位。格式：01 林詩穎 Alice 或 林詩穎 Alice</p>
        <textarea id="batch-textarea" class="batch-textarea" placeholder="01 林詩穎 Alice&#10;02 陳彥宇 Bob"></textarea>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="btn-batch-cancel" data-i18n="btnCancel">取消</button>
          <button type="button" class="btn btn-primary" id="btn-batch-submit" data-i18n="btnConfirmImport">確認匯入</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay no-print" id="edit-subject-modal" role="dialog" aria-modal="true" aria-labelledby="edit-subject-title">
    <div class="modal-window modal-window-sm">
      <div class="modal-header">
        <h3 class="modal-title" id="edit-subject-title" data-i18n="editSubjectTitle">編輯科目</h3>
        <button type="button" class="modal-close-btn" id="edit-subject-close" data-i18n-aria="close" aria-label="關閉">×</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-subj-id">
        <div class="form-group" style="margin-bottom:10px">
          <label class="form-label" for="edit-subj-name" data-i18n="labelSubjectName">科目名稱（必填）</label>
          <input type="text" id="edit-subj-name" class="form-input" autocomplete="off">
        </div>
        <div class="form-group" style="margin-bottom:10px">
          <label class="form-label" for="edit-subj-zh" data-i18n="labelSubjectZh">中文名稱（選填）</label>
          <input type="text" id="edit-subj-zh" class="form-input" autocomplete="off">
        </div>
        <div class="form-group" style="margin-bottom:10px">
          <label class="form-label" for="edit-subj-cat" data-i18n="labelSubjectCategory">分類</label>
          <select id="edit-subj-cat" class="form-input">
            <option value="core" data-i18n="catCore">核心</option>
            <option value="special" data-i18n="catSpecial">專科</option>
            <option value="chinese" data-i18n="catChinese">中文</option>
            <option value="other" data-i18n="catOther">其他</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="btn-edit-subject-cancel" data-i18n="btnCancel">取消</button>
          <button type="button" class="btn btn-primary" id="btn-edit-subject-save" data-i18n="btnSaveEdit">儲存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/comments.js"></script>
  <script src="js/store.js"></script>
  <script src="js/report.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
