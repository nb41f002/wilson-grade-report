<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>葳格雙語成績報告 · Wilson Grade Report</title>
  <link rel="icon" type="image/svg+xml" href="assets/wilson-crest.svg">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <header class="top-navbar no-print">
    <div class="brand-section">
      <img src="assets/wilson-crest.svg" alt="" class="brand-logo" width="36" height="42">
      <div>
        <h1 class="brand-title">雙語小學橫式成績報告</h1>
        <p class="brand-subtitle">Wilson International · 葉容辰老師</p>
      </div>
    </div>
    <div class="save-status-badge" title="資料存在本機瀏覽器">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="save-status-text">就緒</span>
    </div>
    <div class="top-actions">
      <input type="file" id="file-import-input" accept=".json,application/json" hidden>
      <button type="button" class="btn btn-secondary" onclick="document.getElementById('file-import-input').click()">讀取備份</button>
      <button type="button" class="btn btn-secondary" id="btn-export-json">匯出 JSON</button>
      <button type="button" class="btn btn-secondary" id="btn-reset-sample">示範資料</button>
      <button type="button" class="btn btn-print" id="btn-print-current">列印此生</button>
      <button type="button" class="btn btn-accent" id="btn-print-all">全班連印</button>
    </div>
  </header>

  <main class="main-layout">
    <aside class="editor-sidebar no-print">
      <div class="sidebar-header">
        <div class="student-bar">
          <div class="student-selector-wrap">
            <button type="button" class="btn btn-secondary btn-icon" id="btn-prev-student" aria-label="上一位">◀</button>
            <select id="student-select" class="student-select" aria-label="選擇學生"></select>
            <button type="button" class="btn btn-secondary btn-icon" id="btn-next-student" aria-label="下一位">▶</button>
          </div>
          <span class="student-counter" id="student-counter">1 / 1</span>
        </div>
        <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="student-actions">
          <button type="button" class="btn btn-primary btn-sm" id="btn-add-student">＋ 新增</button>
          <button type="button" class="btn btn-secondary btn-sm" id="btn-batch-import">貼上名單</button>
          <button type="button" class="btn btn-danger btn-sm" id="btn-delete-student">刪除</button>
        </div>
      </div>

      <div class="sidebar-scroll">
        <section class="card-section">
          <h2 class="section-title">學校與學期</h2>
          <div class="form-grid-2">
            <div class="form-group span-2">
              <label class="form-label" for="input-year">學年度標題（英文）</label>
              <input type="text" id="input-year" class="form-input" placeholder="The Second Semester of the 114th Academic Year">
            </div>
            <div class="form-group">
              <label class="form-label" for="input-term">報告類型（可改）</label>
              <input type="text" id="input-term" class="form-input" placeholder="Midterm">
            </div>
            <div class="form-group weights-group">
              <label class="form-label">比重 %</label>
              <div class="weight-inputs">
                <label>期中 <input type="number" id="input-weight-mid" class="form-input weight-input" min="0" max="100"></label>
                <label>平時 <input type="number" id="input-weight-daily" class="form-input weight-input" min="0" max="100"></label>
              </div>
            </div>
            <div class="form-group span-2">
              <label class="chk-line"><input type="checkbox" id="chk-homeroom" checked> 簽名區顯示「導師」欄</label>
            </div>
          </div>
        </section>

        <section class="card-section">
          <h2 class="section-title">學生資料</h2>
          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="input-chinese-name">中文姓名</label>
              <input type="text" id="input-chinese-name" class="form-input" placeholder="林詩穎" autocomplete="off">
            </div>
            <div class="form-group">
              <label class="form-label" for="input-english-name">English Name</label>
              <input type="text" id="input-english-name" class="form-input" placeholder="Alice" autocomplete="off">
            </div>
            <div class="form-group">
              <label class="form-label" for="input-class-grade">班級</label>
              <input type="text" id="input-class-grade" class="form-input" placeholder="Grade 4 / 401">
            </div>
            <div class="form-group">
              <label class="form-label" for="input-student-id">學號</label>
              <input type="text" id="input-student-id" class="form-input" placeholder="W114028">
            </div>
          </div>
          <div class="flag-row">
            <label class="chk-line"><input type="checkbox" id="flag-intl"> 國際生</label>
            <label class="chk-line"><input type="checkbox" id="flag-conduct"> 操行 Independent</label>
            <label class="chk-line"><input type="checkbox" id="flag-ixl"> IXL 附註</label>
            <label class="chk-line"><input type="checkbox" id="flag-map"> MAP 列印註記</label>
          </div>
        </section>

        <section class="card-section">
          <h2 class="section-title">顯示科目（可勾選）</h2>
          <div id="subjects-config" class="subjects-config"></div>
        </section>

        <section class="card-section subjects-section">
          <h2 class="section-title">各科成績與評語</h2>
          <p class="section-hint">期中 40% + 平時 60% 自動算總評；可勾「手動」覆寫。操行點笑臉即可。</p>
          <div id="subject-list"></div>
        </section>
      </div>
    </aside>

    <section class="preview-stage">
      <div class="stage-toolbar no-print">
        <span class="zoom-label">A4 橫式預覽（297×210 mm）</span>
        <div class="zoom-controls">
          <button type="button" class="zoom-btn" id="btn-zoom-out" aria-label="縮小">−</button>
          <span id="zoom-val">72%</span>
          <button type="button" class="zoom-btn" id="btn-zoom-in" aria-label="放大">+</button>
          <button type="button" class="btn btn-secondary btn-sm" id="btn-zoom-reset">重設</button>
        </div>
      </div>
      <div class="preview-scroll">
        <div id="report-viewport" class="report-viewport" style="--preview-scale: 0.72"></div>
      </div>
    </section>
  </main>

  <div class="modal-overlay no-print" id="comment-modal" role="dialog" aria-modal="true" aria-labelledby="comment-modal-title">
    <div class="modal-window">
      <div class="modal-header">
        <h3 class="modal-title" id="comment-modal-title">常用評語庫</h3>
        <button type="button" class="modal-close-btn" id="comment-modal-close" aria-label="關閉">×</button>
      </div>
      <div class="modal-body" id="comment-bank-container"></div>
    </div>
  </div>

  <div class="modal-overlay no-print" id="batch-modal" role="dialog" aria-modal="true">
    <div class="modal-window">
      <div class="modal-header">
        <h3 class="modal-title">貼上學生名單</h3>
        <button type="button" class="modal-close-btn" id="batch-modal-close" aria-label="關閉">×</button>
      </div>
      <div class="modal-body">
        <p class="modal-help">一行一位。格式：<code>01 林詩穎 Alice</code> 或 <code>林詩穎 Alice</code></p>
        <textarea id="batch-textarea" class="batch-textarea" placeholder="01 林詩穎 Alice&#10;02 陳彥宇 Bob"></textarea>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="document.getElementById('batch-modal').classList.remove('active')">取消</button>
          <button type="button" class="btn btn-primary" id="btn-batch-submit">確認匯入</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/comments.js"></script>
  <script src="js/store.js"></script>
  <script src="js/report.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
